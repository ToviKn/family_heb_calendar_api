services:
  db:
    image: postgres:16
    container_name: family-calendar-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-family_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-family_calendar}
      POSTGRES_DB: ${POSTGRES_DB:-family_calendar}
    ports:
      - "5432:5432"
    volumes:
      # Persistent local PostgreSQL data volume.
      - family_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-family_user} -d ${POSTGRES_DB:-family_calendar}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: family-calendar-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Use Docker network hostname "db" (the service name above), not localhost.
      DATABASE_URL: postgresql+psycopg://family_user:family_calendar@db:5432/family_calendar
      ENV: development
      DEBUG: "true"
      ENABLE_API_DOCS: "true"
      ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: family-calendar-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    working_dir: /usr/src/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  family_pgdata:
