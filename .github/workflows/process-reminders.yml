name: Process reminders

on:
  schedule:
    # GitHub Actions schedules use UTC and do not support a timezone field.
    # Run hourly, then check Asia/Jerusalem below so DST is handled correctly.
    - cron: "18 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: process-reminders
  cancel-in-progress: false

jobs:
  process-reminders:
    runs-on: ubuntu-latest
    env:
      REMINDER_PROCESS_URL: ${{ secrets.REMINDER_PROCESS_URL }}
      REMINDER_PROCESS_TOKEN: ${{ secrets.REMINDER_PROCESS_TOKEN }}
    steps:
      - name: Trigger protected Render reminder processing
        shell: bash
        run: |
          if [[ -z "$REMINDER_PROCESS_URL" || -z "$REMINDER_PROCESS_TOKEN" ]]; then
            echo "REMINDER_PROCESS_URL and REMINDER_PROCESS_TOKEN must be configured as GitHub Secrets." >&2
            exit 1
          fi

          echo "Requesting the protected Render reminder-processing endpoint."
          curl --fail --show-error --silent \
            --retry 2 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $REMINDER_PROCESS_TOKEN" \
            -H "Accept: application/json" \
            "$REMINDER_PROCESS_URL"
          echo
          echo "Render reminder processing request completed successfully."
