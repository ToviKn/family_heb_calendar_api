name: Process reminders

on:
  schedule:
    # GitHub Actions schedules use UTC and do not support a timezone field.
    # Run hourly, then check Asia/Jerusalem below so DST is handled correctly.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: process-reminders
  cancel-in-progress: false

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.jerusalem-time.outputs.should_run }}
    steps:
      - id: jerusalem-time
        name: Check Jerusalem schedule
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch requested; processing reminders."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_hour="$(TZ=Asia/Jerusalem date +%H)"
          echo "Scheduled run evaluated in Asia/Jerusalem at hour ${local_hour}."
          if [[ "$local_hour" == "00" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: this is not 00:00 in Asia/Jerusalem."
          fi

  process-reminders:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      REMINDER_PROCESS_URL: ${{ secrets.REMINDER_PROCESS_URL }}
      REMINDER_PROCESS_TOKEN: ${{ secrets.REMINDER_PROCESS_TOKEN }}
    steps:
      - name: Trigger protected Render reminder processing
        shell: bash
        run: |
          if [[ -z "$REMINDER_PROCESS_URL" || -z "$REMINDER_PROCESS_TOKEN" ]]; then
            echo "REMINDER_PROCESS_URL and REMINDER_PROCESS_TOKEN must be configured as GitHub Secrets." >&2
            exit 1
          fi

          echo "Requesting the protected Render reminder-processing endpoint."
          curl --fail --show-error --silent \
            --retry 2 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $REMINDER_PROCESS_TOKEN" \
            -H "Accept: application/json" \
            "$REMINDER_PROCESS_URL"
          echo
          echo "Render reminder processing request completed successfully."
